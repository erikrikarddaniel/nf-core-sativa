# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "raxtax_prefilter"
description: |
  Fast raxtax-based self-classification prefilter ahead of the pipeline's expensive
  EPA-ng leave-one-out placement stage. Normalises the alignment, degaps and formats it
  for raxtax, self-classifies (database == query), and drops sequences whose best hit
  disagrees with the declared taxonomy at params.raxtax_filter_rank -- reporting them
  directly as mislabels instead of passing them on for placement.
keywords:
  - taxonomy
  - raxtax
  - prefilter
  - sativa
components:
  - emboss/seqret
  - raxtaxformat
  - raxtax
  - raxtaxfilter
input:
  - ch_taxonomy:
      type: file
      description: |
        Declared taxonomy labels
        Structure: path(taxonomy.tsv), seq_name<TAB>rank1;rank2;...
      pattern: "*.{tax,tsv}"
  - ch_alignment:
      type: file
      description: |
        Aligned, labeled sequences
        Structure: path(alignment), FASTA, Clustal or PHYLIP (auto-detected)
      pattern: "*"
output:
  - taxonomy:
      type: file
      description: |
        Declared taxonomy for sequences NOT flagged by raxtax
        Structure: path(taxonomy.tsv)
      pattern: "*.filtered.tax"
  - alignment:
      type: file
      description: |
        Alignment (FASTA) subset to sequences NOT flagged by raxtax
        Structure: path(alignment.fasta)
      pattern: "*.filtered.fasta"
  - mislabels:
      type: file
      description: |
        Sequences raxtax flagged as likely mislabeled, in the same schema as
        SATIVASCORE's own mislabels output (method column set to "raxtax")
        Structure: [ val(meta), path(mislabels.tsv) ]
      pattern: "*.mislabels.tsv"
  - versions:
      type: file
      description: |
        File containing software versions
        Structure: [ path(versions.yml) ]
      pattern: "versions.yml"
authors:
  - "@erikrikarddaniel"
maintainers:
  - "@erikrikarddaniel"
